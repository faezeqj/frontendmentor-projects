<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social links profile</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="images/favicon-32x32.png">
</head>
<body>
  <main class="box">
    <img class="box__img" src="images/avatar-jessica.jpeg" alt="Avatar">
    <h1 class="box__title">Jessica Randall</h1>
    <h3 class="box__location">London, United Kingdom</h3>
    <p class="box__quote">"Front-end developer and avid reader."</p>
    <div class="box__links">
      <a class="box__link" href="#">Github</a>
      <a class="box__link" href="#">Frontend Mentor</a>
      <a class="box__link" href="#">LinkedIn</a>
      <a class="box__link" href="#">Twitter</a>
      <a class="box__link" href="#">Instagram</a>
    </div>
  </main>
</body>
</html>
